/* ---------------- Main content render ---------------- */

function enableWheelHorizontalScroll(){
  document.querySelectorAll('.table-scroll-x').forEach(container=>{
    if(container.dataset.wheelBound) return; // avoid duplicate listeners if the node is reused
    container.dataset.wheelBound = '1';
    container.addEventListener('wheel', (e)=>{
      if(container.scrollWidth <= container.clientWidth) return; // nothing to scroll horizontally
      if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // let native horizontal gestures pass through
      e.preventDefault();
      container.scrollLeft += e.deltaY;
    }, {passive:false});
  });
}

function renderContent(){
  closeColumnsMenu();
  closeStatusMenu();
  closeAdvSelectMenu();
  closeCalendarPopover();
  const mod = MODULES[state.currentModule];
  const content = document.getElementById('content');

  if(mod.key === 'danhsachtraiphieu'){
    mod.data = buildBondListData();
  }

  if(state.view === 'detail' && mod.hasSimpleDetailView){
    const row = mod.data.find(r=>r.id===state.detailRowId);
    if(row){
      content.innerHTML = renderRelatedOrgDetailView(row);
      bindRelatedOrgDetailEvents(mod, row);
      enableWheelHorizontalScroll();
      return;
    }
    state.view = 'list';
  }

  if(state.view === 'detail' && mod.hasDetailView){
    const row = mod.data.find(r=>r.id===state.detailRowId);
    if(row){
      content.innerHTML = renderDetailView(mod, row);
      bindDetailEvents(mod, row);
      enableWheelHorizontalScroll();
      return;
    }
    state.view = 'list'; // fallback if row no longer exists (e.g. was deleted)
  }

  content.innerHTML = `
    <div class="card">
      <div class="breadcrumb">${esc(mod.groupLabel || 'Quản lý danh mục')} <span>›</span> <span class="current">${esc(mod.title)}</span></div>
      <div class="toolbar-top">
        <div>
          <h1 class="page-heading">${esc(mod.title)}</h1>
          <p class="page-sub">${esc(mod.sub)}</p>
        </div>
        ${mod.hideAddButton ? '' : `<button class="btn btn-primary" id="addBtn">${ICONS.plus}${esc(mod.addLabel)}</button>`}
      </div>
      <div id="tableWrap">${renderTable(mod)}</div>
    </div>
  `;
  bindContentEvents(mod);
  enableWheelHorizontalScroll();
}

function bindContentEvents(mod){
  const ui = uiFor(mod.key);

  const addBtn = document.getElementById('addBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      if(mod.key === 'nhadautu') openInvestorFormModal(null);
      else if(mod.key === 'hosotcph') openIssuerFormModal(null);
      else openFormModal(mod, null);
    });
  }

  const rerenderTable = ()=>{
    closeAdvSelectMenu();
    closeCalendarPopover();
    document.getElementById('tableWrap').innerHTML = renderTable(mod);
    bindTableEvents(mod);
    enableWheelHorizontalScroll();
  };

  bindTableEvents(mod);

  function bindTableEvents(){
    const searchInput = document.getElementById('searchInput');
    let debounceT;
    searchInput.addEventListener('input', e=>{
      clearTimeout(debounceT);
      const val = e.target.value;
      const cursorPos = e.target.selectionStart;
      debounceT = setTimeout(()=>{
        ui.search = val; ui.page = 1; rerenderTable();
        const freshInput = document.getElementById('searchInput');
        if(freshInput){
          freshInput.focus();
          freshInput.setSelectionRange(cursorPos, cursorPos);
        }
      }, 220);
    });

    const statusFilterBtn = document.getElementById('statusFilterBtn');
    if(statusFilterBtn){
      statusFilterBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        openStatusMenu(mod, e.currentTarget, rerenderTable);
      });
    }
    const filterBtnEl = document.getElementById('filterBtn');
    if(filterBtnEl){
      filterBtnEl.addEventListener('click', e=>{
        e.stopPropagation();
        ui.filterPanelOpen = !ui.filterPanelOpen;
        if(ui.filterPanelOpen) ui.advFiltersDraft = {...ui.advFilters, status: ui.status};
        rerenderTable();
      });
    }

    if(mod.hasAdvancedFilter && ui.filterPanelOpen){
      if(!ui.advFiltersDraft) ui.advFiltersDraft = {...ui.advFilters, status: ui.status};
      document.querySelectorAll('[data-adv-field]').forEach(el=>{
        el.addEventListener('input', ()=>{
          ui.advFiltersDraft[el.dataset.advField] = el.value;
        });
      });
      document.querySelectorAll('[data-adv-select]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          openAdvSelectMenu(mod, ui, btn.dataset.advSelect, btn);
        });
      });
      document.querySelectorAll('[data-adv-daterange]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const startKey = btn.dataset.startKey, endKey = btn.dataset.endKey;
          openCalendarPicker(btn, {
            mode:'range',
            initialStart: ui.advFiltersDraft[startKey] || null,
            initialEnd: ui.advFiltersDraft[endKey] || null,
            onApply:(start, end)=>{
              ui.advFiltersDraft[startKey] = start || '';
              ui.advFiltersDraft[endKey] = end || '';
              const span = btn.querySelector('span');
              const hasBoth = start && end;
              span.textContent = hasBoth ? `${formatDateVN(start)} - ${formatDateVN(end)}` : 'Chọn từ ngày - đến ngày';
              span.classList.toggle('placeholder', !hasBoth);
            }
          });
        });
      });
      document.querySelectorAll('[data-adv-date]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const key = btn.dataset.advDate;
          const f = mod.filterFields.find(x=>x.key===key);
          openCalendarPicker(btn, {
            mode:'single',
            initialStart: ui.advFiltersDraft[key] || null,
            onApply:(start)=>{
              ui.advFiltersDraft[key] = start || '';
              const span = btn.querySelector('span');
              span.textContent = start ? formatDateVN(start) : `Chọn ${f.label.toLowerCase()}`;
              span.classList.toggle('placeholder', !start);
            }
          });
        });
      });
      const advApplyBtn = document.getElementById('advFilterApply');
      if(advApplyBtn){
        advApplyBtn.addEventListener('click', ()=>{
          const draft = ui.advFiltersDraft || {};
          ui.status = draft.status || 'all';
          ui.advFilters = {};
          mod.filterFields.forEach(f=>{
            if(f.key==='status') return;
            if(f.type==='daterange'){
              if(draft[f.startKey]) ui.advFilters[f.startKey] = draft[f.startKey];
              if(draft[f.endKey]) ui.advFilters[f.endKey] = draft[f.endKey];
              return;
            }
            if(draft[f.key]) ui.advFilters[f.key] = draft[f.key];
          });
          ui.page = 1;
          rerenderTable();
        });
      }
      const advResetBtn = document.getElementById('advFilterReset');
      if(advResetBtn){
        advResetBtn.addEventListener('click', ()=>{
          ui.advFilters = {};
          ui.status = 'all';
          ui.advFiltersDraft = null;
          ui.page = 1;
          rerenderTable();
        });
      }
    }

    document.getElementById('pageSizeSelect').addEventListener('change', e=>{
      ui.pageSize = Number(e.target.value); ui.page = 1; rerenderTable();
    });

    document.getElementById('exportBtn').addEventListener('click', ()=>{
      exportCsv(mod);
    });

    document.getElementById('columnsBtn').addEventListener('click', (e)=>{
      e.stopPropagation();
      openColumnsMenu(mod, e.currentTarget, rerenderTable);
    });

    document.querySelectorAll('th.sortable').forEach(th=>{
      th.addEventListener('click', ()=>{
        const key = th.dataset.sort;
        if(ui.sortKey===key){ ui.sortDir = ui.sortDir==='asc' ? 'desc' : 'asc'; }
        else { ui.sortKey = key; ui.sortDir = 'asc'; }
        rerenderTable();
      });
    });

    const prev = document.getElementById('prevPage');
    const next = document.getElementById('nextPage');
    if(prev) prev.addEventListener('click', ()=>{ if(ui.page>1){ ui.page--; rerenderTable(); } });
    if(next) next.addEventListener('click', ()=>{ ui.page++; rerenderTable(); });
    document.querySelectorAll('[data-page]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ ui.page = Number(btn.dataset.page); rerenderTable(); });
    });

    document.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = mod.data.find(r=>r.id===btn.dataset.edit);
        if(mod.key === 'nhadautu'){
          openInvestorFormModal(row);
        } else if(mod.key === 'danhsachtraiphieu'){
          navigateToDossierDetail(row.issuerId, row.dossierKey, true);
        } else if(mod.hasSimpleDetailView){
          state.view = 'detail';
          state.detailRowId = row.id;
          state.editingSection = 'related';
          renderContent();
        } else if(mod.hasDetailView){
          state.view = 'detail';
          state.detailRowId = row.id;
          state.detailPrimaryTab = 'tcph';
          state.detailTab = 'chung';
          state.ownershipFilter = 'all';
          state.dossierFilter = 'all';
          state.dossierSearch = '';
          state.dossierDrawerKey = null;
          state.dossierSubTab = 'chung';
          state.editingSection = 'tcph';
          renderContent();
        } else {
          openFormModal(mod, row);
        }
      });
    });
    document.querySelectorAll('[data-investor-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = mod.data.find(r=>r.id===btn.dataset.investorEdit);
        if(row) openInvestorFormModal(row);
      });
    });
    document.querySelectorAll('[data-investor-family]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = mod.data.find(r=>r.id===btn.dataset.investorFamily);
        if(row) openFamilyModal(row);
      });
    });
    document.querySelectorAll('[data-investor-portfolio]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = mod.data.find(r=>r.id===btn.dataset.investorPortfolio);
        if(row) openInvestorPortfolioModal(row);
      });
    });
    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = mod.data.find(r=>r.id===btn.dataset.del);
        if(mod.key === 'danhsachtraiphieu'){
          openConfirmBondDelete(row.issuerId, row.dossierKey, rerenderTable);
        } else {
          openConfirmDelete(mod, row, rerenderTable);
        }
      });
    });
    document.querySelectorAll('[data-view-detail]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = mod.data.find(r=>r.id===btn.dataset.viewDetail);
        if(!row) return;
        if(mod.hasSimpleDetailView){
          state.view = 'detail';
          state.detailRowId = row.id;
          state.editingSection = null;
          renderContent();
        } else if(mod.hasDetailView){
          state.view = 'detail';
          state.detailRowId = row.id;
          state.detailPrimaryTab = 'tcph';
          state.detailTab = 'chung';
          state.ownershipFilter = 'all';
          state.dossierFilter = 'all';
          state.dossierSearch = '';
          state.dossierDrawerKey = null;
          state.dossierSubTab = 'chung';
          state.editingSection = null;
          renderContent();
        } else {
          showToast('success', `Xem chi tiết "${row.name}" — tính năng đang được phát triển`);
        }
      });
    });
    document.querySelectorAll('[data-issuer-goto]').forEach(btn=>{
      btn.addEventListener('click', ()=> navigateToIssuerDetail(btn.dataset.issuerGoto));
    });
    document.querySelectorAll('[data-bond-goto]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [issuerId, dossierKey] = btn.dataset.bondGoto.split('|');
        navigateToDossierDetail(issuerId, dossierKey);
      });
    });

    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');
    if(importBtn && importFileInput){
      importBtn.addEventListener('click', ()=> importFileInput.click());
      importFileInput.addEventListener('change', (e)=>{
        const file = e.target.files[0];
        if(file) handleImportFile(mod, file, rerenderTable);
        importFileInput.value = '';
      });
    }

    const selectAllCb = document.getElementById('selectAllCb');
    if(selectAllCb){
      selectAllCb.addEventListener('change', ()=>{
        const rows = filteredSortedRows(mod);
        const start = (ui.page-1)*ui.pageSize;
        const pageRows = rows.slice(start, start+ui.pageSize);
        if(selectAllCb.checked){ pageRows.forEach(r=> ui.selectedIds.add(r.id)); }
        else { pageRows.forEach(r=> ui.selectedIds.delete(r.id)); }
        rerenderTable();
      });
    }
    document.querySelectorAll('[data-row-select]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const id = cb.dataset.rowSelect;
        if(cb.checked) ui.selectedIds.add(id); else ui.selectedIds.delete(id);
        rerenderTable();
      });
    });
    const bulkClearBtn = document.getElementById('bulkClearBtn');
    if(bulkClearBtn){
      bulkClearBtn.addEventListener('click', ()=>{ ui.selectedIds.clear(); rerenderTable(); });
    }
    const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
    if(bulkDeleteBtn){
      bulkDeleteBtn.addEventListener('click', ()=>{
        const ids = [...ui.selectedIds];
        openConfirmDeleteMultiple(mod, ids, ()=>{ ui.selectedIds.clear(); rerenderTable(); });
      });
    }
  }
}

/* ---------------- Advanced filter: searchable select dropdown ---------------- */

function closeAdvSelectMenu(){
  const existing = document.querySelector('.adv-select-menu');
  if(existing) existing.remove();
  document.removeEventListener('click', closeAdvSelectMenu);
}

function openAdvSelectMenu(mod, ui, field, btnEl){
  closeAdvSelectMenu();
  if(!ui.advFiltersDraft) ui.advFiltersDraft = {...ui.advFilters, status: ui.status};
  const draft = ui.advFiltersDraft;
  const f = mod.filterFields.find(x=>x.key===field);
  if(!f) return;
  const opts = f.options ? f.options : uniqueValues(mod, f.key).map(v=>({value:v, label: v==='-' ? 'Không có' : v}));
  const allLabel = f.allLabel || `Tất cả ${f.label.toLowerCase()}`;
  const allOptions = [{value:'all', label:allLabel}, ...opts];
  let query = '';

  const rect = btnEl.getBoundingClientRect();
  const menuWidth = Math.max(rect.width, 220);
  const menu = document.createElement('div');
  menu.className = 'adv-select-menu';
  menu.style.width = menuWidth + 'px';
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.style.left = Math.min(rect.left, window.innerWidth - menuWidth - 16) + 'px';
  menu.innerHTML = `
    <div class="adv-select-search">
      ${ICONS.search}
      <input type="text" placeholder="Tìm kiếm..." id="advSelectSearchInput" />
    </div>
    <div class="adv-select-list"></div>
  `;
  document.body.appendChild(menu);
  requestAnimationFrame(()=> menu.classList.add('open'));
  menu.addEventListener('click', e => e.stopPropagation());

  const renderList = ()=>{
    const cur = (field==='status' ? draft.status : draft[field]) || 'all';
    const q = query.trim().toLowerCase();
    const filtered = allOptions.filter(o => o.label.toLowerCase().includes(q));
    const listEl = menu.querySelector('.adv-select-list');
    listEl.innerHTML = filtered.length ? filtered.map(o=>`
      <div class="as-item ${cur===o.value?'active':''}" data-value="${esc(o.value)}">${esc(o.label)}</div>
    `).join('') : `<div class="as-empty">Không tìm thấy kết quả</div>`;
    listEl.querySelectorAll('[data-value]').forEach(item=>{
      item.addEventListener('click', ()=>{
        const val = item.dataset.value;
        if(field==='status') draft.status = val; else draft[field] = val;
        const chosen = allOptions.find(o=>o.value===val);
        const labelSpan = btnEl.querySelector('span');
        if(labelSpan) labelSpan.textContent = chosen ? chosen.label : allLabel;
        closeAdvSelectMenu();
      });
    });
  };
  renderList();

  const searchInput = menu.querySelector('#advSelectSearchInput');
  searchInput.focus();
  searchInput.addEventListener('input', e=>{ query = e.target.value; renderList(); });

  setTimeout(()=> document.addEventListener('click', closeAdvSelectMenu), 0);
}

function uniqueValues(mod, key){
  const set = new Set();
  mod.data.forEach(r => { const v = r[key]; if(v!==undefined && v!==null && v!=='') set.add(v); });
  return [...set].sort();
}


function exportCsv(mod){
  const rows = filteredSortedRows(mod);
  const cols = mod.columns.filter(c=>c.key!=='stt' && c.key!=='status');
  const header = [...cols.map(c=>c.label), 'Trạng thái'];
  const lines = [header.join(',')];
  rows.forEach(r=>{
    const line = [...cols.map(c=> `"${String(r[c.key]||'').replace(/"/g,'""')}"`),
      r.status==='active' ? 'Đang hoạt động' : 'Ngừng hoạt động'];
    lines.push(line.join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${mod.key}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('success', `Đã xuất file ${mod.key}.csv`);
}

/* ---------------- Import Excel ---------------- */

function normalizeHeader(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim();
}

function handleImportFile(mod, file, onDone){
  if(typeof XLSX === 'undefined'){
    showToast('danger', 'Không tải được thư viện đọc file Excel. Vui lòng kiểm tra kết nối mạng.');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!json.length){
        showToast('danger', 'File không có dữ liệu để nhập');
        return;
      }
      let added = 0, skipped = 0;
      json.forEach(obj=>{
        const map = {};
        Object.keys(obj).forEach(k => map[normalizeHeader(k)] = obj[k]);
        const code = String(map['ma'] ?? map['code'] ?? '').trim();
        const name = String(map['ten'] ?? map['gia tri'] ?? map['name'] ?? '').trim();
        if(!code || !name){ skipped++; return; }
        const description = String(map['mo ta'] ?? map['description'] ?? '').trim();
        const rawStatus = normalizeHeader(map['trang thai'] ?? map['status'] ?? '');
        const status = rawStatus.includes('ngung') ? 'inactive' : 'active';
        mod.data.unshift({id:uid(), code, name, description, status});
        added++;
      });
      if(added>0){
        showToast('success', `Đã nhập ${added} bản ghi${skipped?`, bỏ qua ${skipped} dòng thiếu Mã/Tên`:''}`);
      } else {
        showToast('danger', 'Không nhập được bản ghi nào. Vui lòng kiểm tra file có cột "Mã" và "Tên".');
      }
      onDone();
    } catch(err){
      console.error(err);
      showToast('danger', 'Không đọc được file. Vui lòng kiểm tra định dạng file Excel/CSV.');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------------- Add/Edit modal ---------------- */

function bindCustomFieldWidgets(overlay){
  overlay.querySelectorAll('[data-date-range-trigger]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const startKey = btn.dataset.startKey, endKey = btn.dataset.endKey;
      const startInput = overlay.querySelector(`input[name="${startKey}"]`);
      const endInput = overlay.querySelector(`input[name="${endKey}"]`);
      openCalendarPicker(btn, {
        mode:'range',
        initialStart: startInput.value || null,
        initialEnd: endInput.value || null,
        onApply:(start, end)=>{
          startInput.value = start || '';
          endInput.value = end || '';
          const span = btn.querySelector('span');
          const hasBoth = start && end;
          span.textContent = hasBoth ? `${formatDateVN(start)} - ${formatDateVN(end)}` : 'Chọn khoảng ngày nghỉ';
          span.classList.toggle('placeholder', !hasBoth);
          const fieldWrap = btn.closest('.field');
          if(hasBoth) fieldWrap.classList.remove('has-error');
        }
      });
    });
  });

  overlay.querySelectorAll('[data-date-single-trigger]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const fieldWrap = btn.closest('.field');
      const hiddenInput = fieldWrap.querySelector('input[type="hidden"]');
      openCalendarPicker(btn, {
        mode:'single',
        initialStart: hiddenInput.value || null,
        onApply:(start)=>{
          hiddenInput.value = start || '';
          const span = btn.querySelector('span');
          span.textContent = start ? formatDateVN(start) : btn.dataset.placeholder;
          span.classList.toggle('placeholder', !start);
          if(start) fieldWrap.classList.remove('has-error');
        }
      });
    });
  });

  overlay.querySelectorAll('[data-toggle-field]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const isOn = !btn.classList.contains('on');
      btn.classList.toggle('on', isOn);
      btn.setAttribute('aria-pressed', String(isOn));
      const hidden = btn.parentElement.querySelector(`input[type="hidden"][name="${btn.dataset.toggleField}"]`);
      if(hidden) hidden.value = isOn ? '1' : '';

      const toggleKey = btn.dataset.toggleField;
      overlay.querySelectorAll(`[data-show-if="${toggleKey}"]`).forEach(dep=>{
        dep.style.display = isOn ? '' : 'none';
        if(!isOn){
          const input = dep.querySelector('input, select');
          if(input) input.value = '';
          const fieldWrap = dep.querySelector('.field');
          if(fieldWrap) fieldWrap.classList.remove('has-error');
        }
      });
    });
  });
}

function collectFieldValues(fields, overlay){
  const values = {};
  let hasError = false;
  fields.forEach(f=>{
    if(f.type === 'section') return;
    if(f.type === 'computed') return;
    if(f.type === 'daterange'){
      const startEl = overlay.querySelector(`[name="${f.startKey}"]`);
      const endEl = overlay.querySelector(`[name="${f.endKey}"]`);
      const fieldWrap = startEl.closest('.field');
      const sVal = startEl.value.trim();
      const eVal = endEl.value.trim();
      if(f.required && (!sVal || !eVal)){
        fieldWrap.classList.add('has-error');
        hasError = true;
      } else {
        fieldWrap.classList.remove('has-error');
      }
      values[f.startKey] = sVal;
      values[f.endKey] = eVal;
      return;
    }
    const el = overlay.querySelector(`[name="${f.key}"]`);
    const fieldWrap = el.closest('.field');
    let val = el.value.trim();
    if(f.required && !val){
      fieldWrap.classList.add('has-error');
      hasError = true;
    } else {
      fieldWrap.classList.remove('has-error');
    }
    values[f.key] = f.type==='number' ? (val===''? '' : Number(val)) : f.type==='toggle' ? (val === '1') : val;
  });
  return {values, hasError};
}

function openFormModal(mod, existingRow){
  const isEdit = !!existingRow;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${mod.fields.length > 10 ? 'modal-lg' : ''}">
      <div class="modal-header">
        <h3>${isEdit ? esc(mod.editModalTitle) : esc(mod.addModalTitle)}</h3>
        <button class="modal-close" id="closeModal">${ICONS.close}</button>
      </div>
      <div class="modal-body" id="modalBody">
        ${mod.fields.map(f=>fieldHtmlWrapped(f, existingRow)).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelBtn">Hủy</button>
        <button class="btn btn-primary" id="saveBtn">Lưu</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));

  const close = ()=>{
    closeCalendarPopover();
    overlay.classList.remove('open');
    setTimeout(()=> overlay.remove(), 150);
  };
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#closeModal').addEventListener('click', close);
  overlay.querySelector('#cancelBtn').addEventListener('click', close);

  bindCustomFieldWidgets(overlay);

  overlay.querySelector('#saveBtn').addEventListener('click', ()=>{
    const {values, hasError} = collectFieldValues(mod.fields, overlay);
    if(hasError) return;

    if(isEdit){
      Object.assign(existingRow, values);
      showToast('success', 'Đã lưu thay đổi');
    } else {
      const newRow = {id:uid(), status:'active', description:'', ...values};
      mod.data.unshift(newRow);
      showToast('success', 'Đã thêm mới thành công');
    }
    close();
    renderContent();
  });
}

function fieldHtmlWrapped(f, existingRow){
  const html = fieldHtml(f, existingRow);
  if(f.showIf){
    const visible = existingRow ? !!existingRow[f.showIf] : false;
    return `<div class="field-conditional" data-show-if="${esc(f.showIf)}"${visible ? '' : ' style="display:none;"'}>${html}</div>`;
  }
  return html;
}

function fieldHtml(f, existingRow){
  if(f.type==='section'){
    return `<div class="field-section">${esc(f.label)}</div>`;
  }
  if(f.type==='computed'){
    return '';
  }
  const val = existingRow ? (existingRow[f.key] ?? '') : '';
  const reqStar = f.required ? '<span class="req">*</span>' : '';
  if(f.type==='select'){
    if(f.key === 'status'){
      const cur = existingRow ? existingRow.status : 'active';
      return `
        <div class="field${f.span2?' span-2':''}">
          <label>${esc(f.label)}${reqStar}</label>
          <select name="${f.key}">
            <option value="active" ${cur==='active'?'selected':''}>Đang hoạt động</option>
            <option value="inactive" ${cur==='inactive'?'selected':''}>Ngừng hoạt động</option>
          </select>
        </div>`;
    }
    const opts = f.options || [];
    const cur = existingRow ? (existingRow[f.key] ?? '') : '';
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}${reqStar}</label>
        <select name="${f.key}">
          ${f.required
            ? `<option value="" disabled ${cur===''?'selected':''}>-- Chọn ${esc(f.label.toLowerCase())} --</option>`
            : `<option value="">-- Chọn ${esc(f.label.toLowerCase())} --</option>`}
          ${opts.map(o=>`<option value="${esc(o.value)}" ${cur===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
        </select>
        <div class="err">Trường này là bắt buộc</div>
      </div>`;
  }
  if(f.type==='toggle'){
    const cur = existingRow ? !!existingRow[f.key] : !!f.defaultValue;
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}</label>
        <button type="button" class="toggle-switch ${cur?'on':''}" data-toggle-field="${f.key}" aria-pressed="${cur}">
          <span class="toggle-knob"></span>
        </button>
        <input type="hidden" name="${f.key}" value="${cur?'1':''}" />
        ${f.hint ? `<div class="field-hint">${esc(f.hint)}</div>` : ''}
      </div>`;
  }
  if(f.type==='date'){
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}${reqStar}</label>
        <input type="date" name="${f.key}" value="${esc(val)}" />
        <div class="err">Trường này là bắt buộc</div>
      </div>`;
  }
  if(f.type==='daterange'){
    const startVal = existingRow ? (existingRow[f.startKey] ?? '') : '';
    const endVal = existingRow ? (existingRow[f.endKey] ?? '') : '';
    const hasBoth = startVal && endVal;
    const displayText = hasBoth ? `${formatDateVN(startVal)} - ${formatDateVN(endVal)}` : 'Chọn khoảng ngày nghỉ';
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}${reqStar}</label>
        <button type="button" class="date-trigger-btn" data-date-range-trigger data-start-key="${f.startKey}" data-end-key="${f.endKey}">
          <span class="${hasBoth?'':'placeholder'}">${esc(displayText)}</span>
          ${ICONS.calendar}
        </button>
        <input type="hidden" name="${f.startKey}" value="${esc(startVal)}" />
        <input type="hidden" name="${f.endKey}" value="${esc(endVal)}" />
        <div class="err">Trường này là bắt buộc</div>
      </div>`;
  }
  if(f.type==='datepicker'){
    const cur = existingRow ? (existingRow[f.key] ?? '') : '';
    const placeholderText = f.placeholder || 'Chọn ngày';
    const displayText = cur ? formatDateVN(cur) : placeholderText;
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}${reqStar}</label>
        <button type="button" class="date-trigger-btn" data-date-single-trigger data-placeholder="${esc(placeholderText)}">
          <span class="${cur?'':'placeholder'}">${esc(displayText)}</span>
          ${ICONS.calendar}
        </button>
        <input type="hidden" name="${f.key}" value="${esc(cur)}" />
        <div class="err">Trường này là bắt buộc</div>
      </div>`;
  }
  if(f.type==='textarea'){
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}${reqStar}</label>
        <textarea name="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>
      </div>`;
  }
  if(f.type==='number'){
    return `
      <div class="field${f.span2?' span-2':''}">
        <label>${esc(f.label)}${reqStar}</label>
        <input type="number" name="${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(val)}" />
        <div class="err">Trường này là bắt buộc</div>
      </div>`;
  }
  return `
    <div class="field${f.span2?' span-2':''}">
      <label>${esc(f.label)}${reqStar}</label>
      <input type="text" name="${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(val)}" />
      <div class="err">Trường này là bắt buộc</div>
    </div>`;
}

/* ---------------- Delete confirm ---------------- */

function openConfirmDelete(mod, row, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay confirm-modal';
  const labelVal = row.name || row.value || row.code || row.category;
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>Xóa bản ghi</h3>
        <button class="modal-close" id="closeModal">${ICONS.close}</button>
      </div>
      <div class="confirm-body">
        <div class="confirm-icon">${ICONS.alert}</div>
        <div class="confirm-text">
          <div class="t">Bạn có chắc chắn muốn xóa "${esc(labelVal)}"?</div>
          <div class="s">Hành động này không thể hoàn tác.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelBtn">Hủy</button>
        <button class="btn" id="confirmDelBtn" style="background:var(--danger); color:#fff;">Xóa</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));
  const close = ()=>{ overlay.classList.remove('open'); setTimeout(()=>overlay.remove(),150); };
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#closeModal').addEventListener('click', close);
  overlay.querySelector('#cancelBtn').addEventListener('click', close);
  overlay.querySelector('#confirmDelBtn').addEventListener('click', ()=>{
    const idx = mod.data.findIndex(r=>r.id===row.id);
    if(idx>-1) mod.data.splice(idx,1);
    close();
    onDone();
    showToast('danger', 'Đã xóa bản ghi');
  });
}

function openConfirmDeleteMultiple(mod, ids, onDone){
  if(!ids.length) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay confirm-modal';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>Xóa bản ghi</h3>
        <button class="modal-close" id="closeModal">${ICONS.close}</button>
      </div>
      <div class="confirm-body">
        <div class="confirm-icon">${ICONS.alert}</div>
        <div class="confirm-text">
          <div class="t">Bạn có chắc chắn muốn xóa ${ids.length} bản ghi đã chọn?</div>
          <div class="s">Hành động này không thể hoàn tác.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelBtn">Hủy</button>
        <button class="btn" id="confirmDelBtn" style="background:var(--danger); color:#fff;">Xóa</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));
  const close = ()=>{ overlay.classList.remove('open'); setTimeout(()=>overlay.remove(),150); };
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#closeModal').addEventListener('click', close);
  overlay.querySelector('#cancelBtn').addEventListener('click', close);
  overlay.querySelector('#confirmDelBtn').addEventListener('click', ()=>{
    const idSet = new Set(ids);
    mod.data = mod.data.filter(r=>!idSet.has(r.id));
    close();
    onDone();
    showToast('danger', `Đã xóa ${ids.length} bản ghi`);
  });
}

/* ---------------- Toast ---------------- */

function showToast(type, msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${type==='success'?ICONS.check:ICONS.alert}<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.style.opacity='0'; el.style.transform='translateY(-6px)'; el.style.transition='all .2s ease';
    setTimeout(()=> el.remove(), 200);
  }, 2600);
}
